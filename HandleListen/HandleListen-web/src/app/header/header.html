<mat-toolbar color="primary">
  @if (auth.isLoggedIn()) {
    <button mat-icon-button (click)="menuToggle.emit()" aria-label="Åbn menu">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <mat-icon>shopping_cart</mat-icon>
  <span class="app-title">Min planlægger</span>
  <span class="spacer"></span>
  @if (auth.isLoggedIn()) {
    <span class="user-email">{{ auth.email() }}</span>
  } @else {
    <a mat-button routerLink="/login">Log ind</a>
  }
</mat-toolbar>
