@if (auth.isLoggedIn()) {
    <button
        type="button"
        class="nav-rail"
        [class.hidden]="sidenavOpen()"
        (click)="openSidenav()"
        aria-label="Åbn menu">
    </button>
}

<mat-sidenav-container class="app-shell">
    @if (auth.isLoggedIn()) {
        <mat-sidenav
            mode="over"
            [opened]="sidenavOpen()"
            (openedChange)="sidenavOpen.set($event)">
            <mat-nav-list>
                <a mat-list-item routerLink="/min-side" routerLinkActive="active-link" (click)="closeSidenav()">
                    <mat-icon matListItemIcon>home</mat-icon>
                    <span matListItemTitle>Min Side</span>
                </a>
                <a mat-list-item routerLink="/handleliste" routerLinkActive="active-link" (click)="closeSidenav()">
                    <mat-icon matListItemIcon>list_alt</mat-icon>
                    <span matListItemTitle>Handleliste</span>
                </a>
                <a mat-list-item routerLink="/kalender" routerLinkActive="active-link" (click)="closeSidenav()">
                    <mat-icon matListItemIcon>calendar_month</mat-icon>
                    <span matListItemTitle>Kalender</span>
                </a>
                <a mat-list-item routerLink="/madplaner" routerLinkActive="active-link" (click)="closeSidenav()">
                    <mat-icon matListItemIcon>restaurant_menu</mat-icon>
                    <span matListItemTitle>Madplaner</span>
                </a>
                <a mat-list-item routerLink="/planer" routerLinkActive="active-link" (click)="closeSidenav()">
                    <mat-icon matListItemIcon>checklist</mat-icon>
                    <span matListItemTitle>Planer</span>
                </a>
                <a mat-list-item routerLink="/forum" routerLinkActive="active-link" (click)="closeSidenav()">
                    <mat-icon matListItemIcon>forum</mat-icon>
                    <span matListItemTitle>Forum</span>
                </a>
                @if (auth.isOwner()) {
                    <a mat-list-item routerLink="/admin" routerLinkActive="active-link" (click)="closeSidenav()">
                        <mat-icon
                            matListItemIcon
                            [matBadge]="adminService.pendingCount() > 0 ? adminService.pendingCount() : null"
                            matBadgeColor="warn"
                            matBadgeSize="small">
                            admin_panel_settings
                        </mat-icon>
                        <span matListItemTitle>Administrator</span>
                    </a>
                }
            </mat-nav-list>
            <mat-divider></mat-divider>
            <mat-nav-list>
                <a mat-list-item routerLink="/indstillinger" routerLinkActive="active-link" (click)="closeSidenav()">
                    <mat-icon matListItemIcon>settings</mat-icon>
                    <span matListItemTitle>Indstillinger</span>
                </a>
                <button mat-list-item (click)="logout()" class="logout-item">
                    <mat-icon matListItemIcon>logout</mat-icon>
                    <span matListItemTitle>Log ud</span>
                </button>
            </mat-nav-list>
        </mat-sidenav>
    }
    <mat-sidenav-content>
        <app-header (menuToggle)="sidenavOpen.set(!sidenavOpen())" />
        <main>
            <router-outlet />
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>
