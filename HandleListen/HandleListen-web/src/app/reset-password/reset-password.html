<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Nulstil adgangskode</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (linkInvalid()) {
        <p>Linket mangler nogle oplysninger. Prøv at bede om et nyt nulstillingslink.</p>
      } @else if (success()) {
        <p>Din adgangskode er nulstillet.</p>
        <button mat-flat-button color="primary" class="full-width" (click)="goToLogin()">Log ind</button>
      } @else {
        <form (ngSubmit)="submit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Ny adgangskode</mat-label>
            <input matInput [(ngModel)]="password" name="password" type="password" autocomplete="new-password" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Bekræft ny adgangskode</mat-label>
            <input matInput [(ngModel)]="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />
          </mat-form-field>

          @if (errorMessage()) {
            <p class="error-text">{{ errorMessage() }}</p>
          }

          <button mat-flat-button color="primary" type="submit" class="full-width">Nulstil adgangskode</button>
        </form>
      }
    </mat-card-content>
    <mat-card-actions align="end">
      <a mat-button routerLink="/login">Tilbage til login</a>
    </mat-card-actions>
  </mat-card>
</div>
