<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Glemt adgangskode</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (submitted()) {
        <p>Hvis emailen findes hos os, har vi sendt et link til at nulstille din adgangskode.</p>
      } @else {
        <p>Indtast din email, så sender vi dig et link til at nulstille din adgangskode.</p>
        <form (ngSubmit)="submit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput [(ngModel)]="email" name="email" type="email" autocomplete="email" required />
          </mat-form-field>

          <button mat-flat-button color="primary" type="submit" class="full-width">Send nulstillingslink</button>
        </form>
      }
    </mat-card-content>
    <mat-card-actions align="end">
      <a mat-button routerLink="/login">Tilbage til login</a>
    </mat-card-actions>
  </mat-card>
</div>
