<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Opret konto</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="register()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="email" name="email" type="email" autocomplete="email" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Adgangskode</mat-label>
          <input matInput [(ngModel)]="password" name="password" type="password" autocomplete="new-password" required />
          <mat-hint>Mindst 6 tegn, med både store og små bogstaver og et tal.</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Bekræft adgangskode</mat-label>
          <input matInput [(ngModel)]="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />
        </mat-form-field>

        @if (errorMessage()) {
          <p class="error-text">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" class="full-width">Opret konto</button>
      </form>
    </mat-card-content>
    <mat-card-actions align="end">
      <a mat-button routerLink="/login">Log ind i stedet</a>
    </mat-card-actions>
  </mat-card>
</div>
