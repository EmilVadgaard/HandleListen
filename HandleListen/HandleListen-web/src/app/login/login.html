<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Log ind</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="login()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="email" name="email" type="email" autocomplete="email" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Adgangskode</mat-label>
          <input matInput [(ngModel)]="password" name="password" type="password" autocomplete="current-password" required />
        </mat-form-field>

        @if (errorMessage()) {
          <p class="error-text">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" class="full-width">Log ind</button>
      </form>
      <a class="forgot-password-link" routerLink="/forgot-password">Glemt adgangskode?</a>
    </mat-card-content>
    <mat-card-actions align="end">
      <a mat-button routerLink="/register">Opret konto</a>
    </mat-card-actions>
  </mat-card>
</div>
